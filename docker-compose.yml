services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "14330:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Your_password123\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  api:
    build:
      context: .
      dockerfile: PRN232.LMS.API/Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=LMS;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      # JWT signing key (>= 32 bytes). Set JWT_SECRET in the shell or in a .env file to override the local-only default.
      Jwt__Secret: "${JWT_SECRET:-local-docker-only-jwt-secret-change-me-0123456789}"
    depends_on:
      db:
        condition: service_healthy
